<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel Público — Sala de Escape Política</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .container { max-width: 1280px; }
  .hero { text-align: center; padding: 44px 20px 18px; position: relative; z-index: 1; }
  .hero .trophy { display: inline-block; font-size: 46px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }
  h1.title {
    color: #fff;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 10px 0 6px;
  }
  p.subtitle {
    text-align: center;
    color: var(--gold-light);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 6px 16px;
    border-top: 1px solid rgba(240,179,35,0.4);
    border-bottom: 1px solid rgba(240,179,35,0.4);
    display: inline-block;
  }
  .subtitle-wrap { text-align: center; margin-bottom: 10px; }
  .progreso {
    text-align: center;
    color: var(--gray);
    margin-top: 22px;
    font-size: 13px;
    font-weight: 600;
  }

  /* 5 cajas aisladas, sin ranking ni orden por puntaje */
  .grid-provincias {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
  }
  .provincia-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px 20px 16px;
    border-top: 3px solid var(--blue-800);
    box-shadow: 0 14px 30px rgba(5, 14, 33, 0.35);
  }
  .provincia-card h2 {
    font-size: 16px;
    font-weight: 900;
    color: var(--blue-900);
    text-transform: uppercase;
    letter-spacing: .02em;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--gold);
  }
  .provincia-card .eje-barra:last-child { margin-bottom: 0; }

  /* Espera de escrutinio: reemplaza las cajas cuando cerraron todas las salas */
  .escrutinio-espera {
    grid-column: 1 / -1;
    text-align: center;
    background: var(--surface);
    border-radius: 16px;
    padding: 60px 30px;
    box-shadow: 0 14px 30px rgba(5, 14, 33, 0.35);
  }
  .escrutinio-icono { font-size: 54px; animation: pulseEscrutinio 1.6s ease-in-out infinite; }
  @keyframes pulseEscrutinio { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .75; } }
  .escrutinio-espera h2 { color: var(--blue-900); font-size: 26px; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .03em; }
  .escrutinio-espera p { color: var(--gray); font-size: 15px; }

  /* Resultado final: las mismas cajas, ahora con el % que asignaron los organizadores */
  .provincia-card.resultado-final { text-align: center; transition: transform .3s ease, box-shadow .3s ease; }
  .provincia-card.resultado-final.ganador { border-top-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 18px 34px rgba(5,14,33,.4); transform: translateY(-4px); }
  .medalla { color: var(--gold-dark); font-weight: 900; font-size: 12px; letter-spacing: .06em; margin-bottom: 6px; text-transform: uppercase; }
  .resultado-pct { font-size: 34px; font-weight: 900; color: var(--blue-900); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  .provincia-card.resultado-final.revelado { animation: popResultado .4s ease; }
  @keyframes popResultado { 0% { transform: scale(0.97); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
</style>
</head>
<body>
  <div class="hero">
    <span class="trophy">🏆</span>
    <h1 class="title">Sala de Escape Política</h1>
    <div class="subtitle-wrap"><p class="subtitle" id="crisis-line">Cargando…</p></div>
  </div>
  <div class="container">
    <div class="grid-provincias" id="grid-provincias"></div>
    <p class="progreso" id="progreso-linea"></p>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="publico.js"></script>
</body>
</html>
