<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leaderboard — Sala de Escape Política</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .container { max-width: 1000px; }
  .card { padding: 26px 32px; }
  .hero { text-align: center; padding: 44px 20px 18px; position: relative; z-index: 1; }
  .hero .trophy { display: inline-block; font-size: 46px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }
  h1.title {
    color: #fff;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 10px 0 6px;
  }
  p.subtitle {
    text-align: center;
    color: var(--gold-light);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 6px 16px;
    border-top: 1px solid rgba(240,179,35,0.4);
    border-bottom: 1px solid rgba(240,179,35,0.4);
    display: inline-block;
  }
  .subtitle-wrap { text-align: center; margin-bottom: 10px; }
  table { font-size: 15px; }
  th { font-size: 11px; }
  td { padding: 12px 10px; }
  .progreso {
    text-align: center;
    color: var(--gray);
    margin-top: 16px;
    font-size: 13px;
    font-weight: 600;
  }
  .rank { font-size: 22px; font-weight: 900; color: var(--blue-800); }
  .leader-row-1 .rank { color: var(--gold-dark); }
</style>
</head>
<body>
  <div class="hero">
    <span class="trophy">🏆</span>
    <h1 class="title">Sala de Escape Política</h1>
    <div class="subtitle-wrap"><p class="subtitle" id="crisis-line">Cargando…</p></div>
  </div>
  <div class="container">
    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Provincia</th><th>Imagen Positiva</th><th>Intención de Voto</th><th>Gobernabilidad</th><th>Salud Fiscal</th><th>Orden Público</th></tr></thead>
        <tbody id="tabla-leaderboard"></tbody>
      </table>
      <p class="progreso" id="progreso-linea"></p>
    </div>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="publico.js"></script>
</body>
</html>
